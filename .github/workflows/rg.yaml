name: Terraform CI-CD

on:
  push:
    branches:
      - "feature/**"
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"

jobs:

  # ==========================================================
  # FEATURE BRANCH
  # ==========================================================

  terraform-plan-feature:

    name: Terraform Plan - Feature

    if: startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Azure Login using Customer Key / Client Secret
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }


      # ------------------------------------------------------
      # Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # Create terraform.tfvars from GitHub Secret
      # ------------------------------------------------------

      - name: Create terraform.tfvars
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |
          printf '%s' "$TFVARS_CONTENT" > terraform.tfvars


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan


      # ------------------------------------------------------
      # Upload Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-feature
          path: tfplan


  # ==========================================================
  # FEATURE APPROVAL
  # ==========================================================

  feature-approval:

    name: Feature Branch Approval

    needs: terraform-plan-feature

    runs-on: ubuntu-latest

    environment:
      name: feature-approval

    steps:

      - name: Approval Completed
        run: |
          echo "Feature branch plan approved."
          echo "No Terraform Apply will run for feature branch."


  # ==========================================================
  # MAIN BRANCH
  # ==========================================================

  terraform-plan-main:

    name: Terraform Plan - Main

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }


      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # Create TFVars
      # ------------------------------------------------------

      - name: Create terraform.tfvars
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |
          printf '%s' "$TFVARS_CONTENT" > terraform.tfvars


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan
        run: terraform plan -var-file="terraform.tfvars" -out=tfplan


      # ------------------------------------------------------
      # Upload Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-main
          path: tfplan


  # ==========================================================
  # MAIN - APPROVAL + APPLY
  # ==========================================================

  terraform-apply-main:

    name: Terraform Apply - Production

    needs: terraform-plan-main

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.CLIENT_ID }}",
              "clientSecret": "${{ secrets.CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.SUBSCRIPTIONS_ID }}",
              "tenantId": "${{ secrets.TENANT_ID }}"
            }


      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # Create TFVars
      # ------------------------------------------------------

      - name: Create terraform.tfvars
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |
          printf '%s' "$TFVARS_CONTENT" > terraform.tfvars


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        run: terraform init


      # ------------------------------------------------------
      # Download Plan
      # ------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-main
          path: .


      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
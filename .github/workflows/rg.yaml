name: Terraform CI-CD


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  push:
    branches:
      - "feature/**"
      - main

  pull_request:
    branches:
      - main


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:

  TF_VERSION: "1.9.8"

  # Terraform root module
  TF_WORKING_DIR: "./Dev Module"


# ============================================================
# JOB 1
# FEATURE BRANCH - TERRAFORM PLAN
# ============================================================

jobs:

  terraform-plan-feature:

    name: Terraform Plan - Feature

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest


    # ========================================================
    # MAP EXISTING GITHUB SECRETS TO TERRAFORM ARM VARIABLES
    # ========================================================

    env:

      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}

      ARM_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTIONS_ID }}

      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}


    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # Azure Login
      #
      # Existing AZURE_CREDENTIALS secret
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------------
      # Verify Azure Login
      # ------------------------------------------------------

      - name: Verify Azure Login
        shell: bash
        run: |

          echo "Checking Azure authentication..."

          az account show --output table

          echo "Azure login successful."


      # ------------------------------------------------------
      # Verify Terraform Directory
      # ------------------------------------------------------

      - name: Verify Terraform Directory
        shell: bash
        run: |

          echo "Current directory:"
          pwd

          echo ""
          echo "Terraform working directory:"
          echo "${TF_WORKING_DIR}"

          if [ ! -d "${TF_WORKING_DIR}" ]; then
            echo "ERROR: Terraform working directory does not exist."
            exit 1
          fi

          echo ""
          echo "Terraform files:"

          find "${TF_WORKING_DIR}" -maxdepth 1 -type f -name "*.tf" -print

          TF_COUNT=$(find "${TF_WORKING_DIR}" -maxdepth 1 -type f -name "*.tf" | wc -l)

          if [ "$TF_COUNT" -eq 0 ]; then
            echo "ERROR: No Terraform .tf files found."
            exit 1
          fi

          echo ""
          echo "Found ${TF_COUNT} Terraform files."


      # ------------------------------------------------------
      # Verify Terraform Authentication
      #
      # SECRET VALUES WILL NOT BE PRINTED
      # ------------------------------------------------------

      - name: Verify Terraform Authentication
        shell: bash
        run: |

          echo "Checking Terraform authentication variables..."

          if [ -z "$ARM_CLIENT_ID" ]; then
            echo "ERROR: ARM_CLIENT_ID is not configured."
            exit 1
          fi

          if [ -z "$ARM_CLIENT_SECRET" ]; then
            echo "ERROR: ARM_CLIENT_SECRET is not configured."
            exit 1
          fi

          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then
            echo "ERROR: ARM_SUBSCRIPTION_ID is not configured."
            exit 1
          fi

          if [ -z "$ARM_TENANT_ID" ]; then
            echo "ERROR: ARM_TENANT_ID is not configured."
            exit 1
          fi

          echo "Terraform ARM authentication variables are configured successfully."


      # ------------------------------------------------------
      # Create terraform.tfvars
      #
      # Existing TERRAFORM_TFVARS secret
      # ------------------------------------------------------

      - name: Create Terraform TFVars
        shell: bash
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |

          if [ -z "$TFVARS_CONTENT" ]; then
            echo "ERROR: TERRAFORM_TFVARS secret is empty."
            exit 1
          fi

          printf '%s' "$TFVARS_CONTENT" > "${TF_WORKING_DIR}/terraform.tfvars"

          echo "terraform.tfvars created successfully."


      # ------------------------------------------------------
      # Verify TFVars
      # ------------------------------------------------------

      - name: Verify Terraform TFVars
        shell: bash
        run: |

          if [ ! -f "${TF_WORKING_DIR}/terraform.tfvars" ]; then
            echo "ERROR: terraform.tfvars was not created."
            exit 1
          fi

          echo "terraform.tfvars exists."


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Format
      # ------------------------------------------------------

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform fmt -check -recursive


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform validate


      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform plan \
            -var-file="terraform.tfvars" \
            -out="tfplan"


      # ------------------------------------------------------
      # Verify Terraform Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan
        shell: bash
        run: |

          if [ ! -f "${TF_WORKING_DIR}/tfplan" ]; then
            echo "ERROR: tfplan was not created."
            exit 1
          fi

          echo "Terraform plan created successfully."


      # ------------------------------------------------------
      # Upload Terraform Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-feature-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1



  # ============================================================
  # JOB 2
  # FEATURE BRANCH APPROVAL
  # ============================================================

  feature-approval:

    name: Feature Branch Approval

    needs:
      - terraform-plan-feature

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    environment:
      name: Feature-Approval

    steps:

      - name: Feature Approval Completed
        run: |

          echo "=========================================="
          echo "Feature Terraform Plan Approved"
          echo "=========================================="

          echo "No Terraform Apply will run."



  # ============================================================
  # JOB 3
  # MAIN BRANCH - TERRAFORM PLAN
  # ============================================================

  terraform-plan-main:

    name: Terraform Plan - Main

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest


    # ========================================================
    # MAP EXISTING GITHUB SECRETS
    # ========================================================

    env:

      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}

      ARM_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTIONS_ID }}

      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}


    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------------
      # Verify Azure Login
      # ------------------------------------------------------

      - name: Verify Azure Login
        shell: bash
        run: |

          az account show --output table

          echo "Azure login successful."


      # ------------------------------------------------------
      # Verify Terraform Authentication
      # ------------------------------------------------------

      - name: Verify Terraform Authentication
        shell: bash
        run: |

          if [ -z "$ARM_CLIENT_ID" ]; then
            echo "ERROR: ARM_CLIENT_ID is not configured."
            exit 1
          fi

          if [ -z "$ARM_CLIENT_SECRET" ]; then
            echo "ERROR: ARM_CLIENT_SECRET is not configured."
            exit 1
          fi

          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then
            echo "ERROR: ARM_SUBSCRIPTION_ID is not configured."
            exit 1
          fi

          if [ -z "$ARM_TENANT_ID" ]; then
            echo "ERROR: ARM_TENANT_ID is not configured."
            exit 1
          fi

          echo "Terraform ARM authentication variables are configured successfully."


      # ------------------------------------------------------
      # Verify Terraform Directory
      # ------------------------------------------------------

      - name: Verify Terraform Directory
        shell: bash
        run: |

          if [ ! -d "${TF_WORKING_DIR}" ]; then
            echo "ERROR: Terraform directory does not exist."
            exit 1
          fi

          TF_COUNT=$(find "${TF_WORKING_DIR}" -maxdepth 1 -type f -name "*.tf" | wc -l)

          if [ "$TF_COUNT" -eq 0 ]; then
            echo "ERROR: No Terraform .tf files found."
            exit 1
          fi

          echo "Terraform configuration found."


      # ------------------------------------------------------
      # Create TFVars
      # ------------------------------------------------------

      - name: Create Terraform TFVars
        shell: bash
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |

          if [ -z "$TFVARS_CONTENT" ]; then
            echo "ERROR: TERRAFORM_TFVARS secret is empty."
            exit 1
          fi

          printf '%s' "$TFVARS_CONTENT" > "${TF_WORKING_DIR}/terraform.tfvars"

          echo "terraform.tfvars created successfully."


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform init


      # ------------------------------------------------------
      # Terraform Format
      # ------------------------------------------------------

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform fmt -check -recursive


      # ------------------------------------------------------
      # Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform validate


      # ------------------------------------------------------
      # Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform plan \
            -var-file="terraform.tfvars" \
            -out="tfplan"


      # ------------------------------------------------------
      # Verify Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan
        shell: bash
        run: |

          if [ ! -f "${TF_WORKING_DIR}/tfplan" ]; then
            echo "ERROR: tfplan was not created."
            exit 1
          fi

          echo "Terraform plan created successfully."


      # ------------------------------------------------------
      # Upload Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-main-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1



  # ============================================================
  # JOB 4
  # MAIN BRANCH - PRODUCTION APPLY
  # ============================================================

  terraform-apply-main:

    name: Terraform Apply - Production

    needs:
      - terraform-plan-main

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest


    # ========================================================
    # PRODUCTION ENVIRONMENT
    # ========================================================

    environment:
      name: Prod


    # ========================================================
    # MAP EXISTING GITHUB SECRETS
    # ========================================================

    env:

      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}

      ARM_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTIONS_ID }}

      ARM_TENANT_ID: ${{ secrets.TENANT_ID }}


    steps:

      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # Azure Login
      # ------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------------
      # Verify Azure Login
      # ------------------------------------------------------

      - name: Verify Azure Login
        shell: bash
        run: |

          az account show --output table

          echo "Azure login successful."


      # ------------------------------------------------------
      # Verify Terraform Authentication
      # ------------------------------------------------------

      - name: Verify Terraform Authentication
        shell: bash
        run: |

          if [ -z "$ARM_CLIENT_ID" ]; then
            echo "ERROR: ARM_CLIENT_ID is not configured."
            exit 1
          fi

          if [ -z "$ARM_CLIENT_SECRET" ]; then
            echo "ERROR: ARM_CLIENT_SECRET is not configured."
            exit 1
          fi

          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then
            echo "ERROR: ARM_SUBSCRIPTION_ID is not configured."
            exit 1
          fi

          if [ -z "$ARM_TENANT_ID" ]; then
            echo "ERROR: ARM_TENANT_ID is not configured."
            exit 1
          fi

          echo "Terraform ARM authentication variables are configured successfully."


      # ------------------------------------------------------
      # Verify Terraform Directory
      # ------------------------------------------------------

      - name: Verify Terraform Directory
        shell: bash
        run: |

          if [ ! -d "${TF_WORKING_DIR}" ]; then
            echo "ERROR: Terraform directory does not exist."
            exit 1
          fi

          TF_COUNT=$(find "${TF_WORKING_DIR}" -maxdepth 1 -type f -name "*.tf" | wc -l)

          if [ "$TF_COUNT" -eq 0 ]; then
            echo "ERROR: No Terraform .tf files found."
            exit 1
          fi

          echo "Terraform configuration found."


      # ------------------------------------------------------
      # Create TFVars
      # ------------------------------------------------------

      - name: Create Terraform TFVars
        shell: bash
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |

          if [ -z "$TFVARS_CONTENT" ]; then
            echo "ERROR: TERRAFORM_TFVARS secret is empty."
            exit 1
          fi

          printf '%s' "$TFVARS_CONTENT" > "${TF_WORKING_DIR}/terraform.tfvars"

          echo "terraform.tfvars created successfully."


      # ------------------------------------------------------
      # Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform init


      # ------------------------------------------------------
      # Download Terraform Plan
      # ------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-main-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}


      # ------------------------------------------------------
      # Verify Terraform Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan
        shell: bash
        run: |

          if [ ! -f "${TF_WORKING_DIR}/tfplan" ]; then
            echo "ERROR: tfplan file not found."
            exit 1
          fi

          echo "Terraform plan found."

          ls -lh "${TF_WORKING_DIR}/tfplan"


      # ------------------------------------------------------
      # Terraform Apply
      # ------------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |

          terraform apply \
            -auto-approve \
            tfplan


      # ------------------------------------------------------
      # Deployment Completed
      # ------------------------------------------------------

      - name: Deployment Completed
        run: |

          echo "=========================================="
          echo "Terraform Apply Completed Successfully"
          echo "=========================================="
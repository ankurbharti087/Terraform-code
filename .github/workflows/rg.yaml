name: Terraform CI-CD

# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  # Feature branch par push
  push:
    branches:
      - "feature/**"
      - main

  # Pull Request towards main
  pull_request:
    branches:
      - main


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:

  # Terraform version
  TF_VERSION: "1.9.8"

  # IMPORTANT:
  # Aapke Terraform .tf files "Dev Module" ke andar hain.
  #
  # Dev Module/
  # ├── backend.tf
  # ├── main.tf
  # ├── provider.tf
  # └── variable.tf
  #
  TF_WORKING_DIR: "./Dev Module"


# ============================================================
# JOB 1
# FEATURE BRANCH
#
# Feature Push
#      ↓
# Checkout
#      ↓
# Azure Login
#      ↓
# Terraform Setup
#      ↓
# Verify Terraform Files
#      ↓
# Create TFVars
#      ↓
# Terraform Init
#      ↓
# Terraform Validate
#      ↓
# Terraform Plan
#      ↓
# Upload Plan
# ============================================================

jobs:

  terraform-plan-feature:

    name: Terraform Plan - Feature

    # Sirf feature branch push par chalega
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # --------------------------------------------------------
      # 3. Verify Repository Structure
      # --------------------------------------------------------

      - name: Verify Repository Structure
        shell: bash
        run: |
          echo "=========================================="
          echo "Current Directory"
          echo "=========================================="
          pwd

          echo ""
          echo "=========================================="
          echo "Repository Structure"
          echo "=========================================="
          ls -la

          echo ""
          echo "=========================================="
          echo "Terraform Files"
          echo "=========================================="
          find . -name "*.tf" -type f


      # --------------------------------------------------------
      # 4. Verify Terraform Working Directory
      # --------------------------------------------------------

      - name: Verify Terraform Directory
        shell: bash
        run: |

          if [ ! -d "${TF_WORKING_DIR}" ]; then
            echo "ERROR: Terraform directory does not exist."
            echo "Expected directory: ${TF_WORKING_DIR}"
            exit 1
          fi

          echo "Terraform directory found:"
          echo "${TF_WORKING_DIR}"

          echo ""
          echo "Terraform configuration files:"

          find "${TF_WORKING_DIR}" -maxdepth 1 -name "*.tf" -type f


      # --------------------------------------------------------
      # 5. Verify Terraform Configuration
      # --------------------------------------------------------

      - name: Verify Terraform Configuration
        shell: bash
        run: |

          TF_COUNT=$(find "${TF_WORKING_DIR}" -maxdepth 1 -name "*.tf" -type f | wc -l)

          if [ "$TF_COUNT" -eq 0 ]; then
            echo "ERROR: No Terraform configuration files found."
            echo ""
            echo "Terraform working directory:"
            echo "${TF_WORKING_DIR}"
            exit 1
          fi

          echo ""
          echo "Found $TF_COUNT Terraform configuration file(s)."


      # --------------------------------------------------------
      # 6. Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------------
      # 7. Create terraform.tfvars
      #
      # GitHub Secret:
      #
      # TERRAFORM_TFVARS
      #
      # Secret ko Dev Module directory mein create karenge.
      # --------------------------------------------------------

      - name: Create Terraform TFVars
        shell: bash
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |

          if [ -z "$TFVARS_CONTENT" ]; then
            echo "ERROR: TERRAFORM_TFVARS GitHub Secret is empty."
            exit 1
          fi

          printf '%s' "$TFVARS_CONTENT" > "${TF_WORKING_DIR}/terraform.tfvars"

          echo "terraform.tfvars created successfully."


      # --------------------------------------------------------
      # 8. Verify TFVars
      # --------------------------------------------------------

      - name: Verify TFVars
        shell: bash
        run: |

          if [ ! -f "${TF_WORKING_DIR}/terraform.tfvars" ]; then
            echo "ERROR: terraform.tfvars was not created."
            exit 1
          fi

          echo "terraform.tfvars exists."


      # --------------------------------------------------------
      # 9. Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # --------------------------------------------------------
      # 10. Terraform Format Check
      # --------------------------------------------------------

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive


      # --------------------------------------------------------
      # 11. Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # --------------------------------------------------------
      # 12. Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out="tfplan"


      # --------------------------------------------------------
      # 13. Verify Plan
      # --------------------------------------------------------

      - name: Verify Terraform Plan
        shell: bash
        run: |

          if [ ! -f "${TF_WORKING_DIR}/tfplan" ]; then
            echo "ERROR: tfplan file was not created."
            exit 1
          fi

          echo "Terraform plan created successfully."


      # --------------------------------------------------------
      # 14. Upload Terraform Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-feature-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1


  # ============================================================
  # JOB 2
  # FEATURE BRANCH APPROVAL
  #
  # Plan
  #   ↓
  # Manual Approval
  #   ↓
  # NO APPLY
  # ============================================================

  feature-approval:

    name: Feature Branch Approval

    needs:
      - terraform-plan-feature

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    environment:
      name: Feature-Approval

    steps:

      - name: Feature Approval Completed
        run: |

          echo "=========================================="
          echo "Feature Branch Terraform Plan Approved"
          echo "=========================================="

          echo ""
          echo "No Terraform Apply will run."

          echo ""
          echo "Feature workflow completed."


  # ============================================================
  # JOB 3
  # MAIN BRANCH PLAN
  #
  # Main Push
  #      ↓
  # Checkout
  #      ↓
  # Azure Login
  #      ↓
  # Terraform Setup
  #      ↓
  # Create TFVars
  #      ↓
  # Terraform Init
  #      ↓
  # Validate
  #      ↓
  # Plan
  #      ↓
  # Upload Plan
  # ============================================================

  terraform-plan-main:

    name: Terraform Plan - Main

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # --------------------------------------------------------
      # 3. Verify Terraform Files
      # --------------------------------------------------------

      - name: Verify Terraform Files
        shell: bash
        run: |

          echo "Current directory:"
          pwd

          echo ""
          echo "Terraform files:"
          find . -name "*.tf" -type f


      # --------------------------------------------------------
      # 4. Verify Terraform Directory
      # --------------------------------------------------------

      - name: Verify Terraform Directory
        shell: bash
        run: |

          if [ ! -d "${TF_WORKING_DIR}" ]; then
            echo "ERROR: Terraform directory does not exist."
            echo "Expected: ${TF_WORKING_DIR}"
            exit 1
          fi

          TF_COUNT=$(find "${TF_WORKING_DIR}" -maxdepth 1 -name "*.tf" -type f | wc -l)

          if [ "$TF_COUNT" -eq 0 ]; then
            echo "ERROR: No Terraform .tf files found."
            exit 1
          fi

          echo "Terraform configuration found."


      # --------------------------------------------------------
      # 5. Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------------
      # 6. Create terraform.tfvars
      # --------------------------------------------------------

      - name: Create Terraform TFVars
        shell: bash
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |

          if [ -z "$TFVARS_CONTENT" ]; then
            echo "ERROR: TERRAFORM_TFVARS GitHub Secret is empty."
            exit 1
          fi

          printf '%s' "$TFVARS_CONTENT" > "${TF_WORKING_DIR}/terraform.tfvars"

          echo "terraform.tfvars created successfully."


      # --------------------------------------------------------
      # 7. Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # --------------------------------------------------------
      # 8. Terraform Format Check
      # --------------------------------------------------------

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive


      # --------------------------------------------------------
      # 9. Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate


      # --------------------------------------------------------
      # 10. Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out="tfplan"


      # --------------------------------------------------------
      # 11. Verify Terraform Plan
      # --------------------------------------------------------

      - name: Verify Terraform Plan
        shell: bash
        run: |

          if [ ! -f "${TF_WORKING_DIR}/tfplan" ]; then
            echo "ERROR: tfplan file was not created."
            exit 1
          fi

          echo "Terraform plan created successfully."


      # --------------------------------------------------------
      # 12. Upload Terraform Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-main-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1


  # ============================================================
  # JOB 4
  # PRODUCTION APPROVAL + APPLY
  #
  # Main Plan
  #      ↓
  # Prod Approval
  #      ↓
  # Download Same Plan
  #      ↓
  # Terraform Apply
  # ============================================================

  terraform-apply-main:

    name: Terraform Apply - Production

    needs:
      - terraform-plan-main

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # ==========================================================
    # IMPORTANT
    #
    # GitHub Repository:
    #
    # Settings
    #    ↓
    # Environments
    #    ↓
    # Prod
    #    ↓
    # Required reviewers
    #
    # Configure approval here.
    # ==========================================================

    environment:
      name: Prod

    steps:

      # --------------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # --------------------------------------------------------
      # 3. Verify Terraform Directory
      # --------------------------------------------------------

      - name: Verify Terraform Directory
        shell: bash
        run: |

          if [ ! -d "${TF_WORKING_DIR}" ]; then
            echo "ERROR: Terraform directory does not exist."
            exit 1
          fi

          TF_COUNT=$(find "${TF_WORKING_DIR}" -maxdepth 1 -name "*.tf" -type f | wc -l)

          if [ "$TF_COUNT" -eq 0 ]; then
            echo "ERROR: No Terraform .tf files found."
            exit 1
          fi

          echo "Terraform configuration found."


      # --------------------------------------------------------
      # 4. Azure Login
      # --------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # --------------------------------------------------------
      # 5. Create terraform.tfvars
      # --------------------------------------------------------

      - name: Create Terraform TFVars
        shell: bash
        env:
          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |

          if [ -z "$TFVARS_CONTENT" ]; then
            echo "ERROR: TERRAFORM_TFVARS GitHub Secret is empty."
            exit 1
          fi

          printf '%s' "$TFVARS_CONTENT" > "${TF_WORKING_DIR}/terraform.tfvars"

          echo "terraform.tfvars created successfully."


      # --------------------------------------------------------
      # 6. Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init


      # --------------------------------------------------------
      # 7. Download Terraform Plan
      # --------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-main-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}


      # --------------------------------------------------------
      # 8. Verify Terraform Plan
      # --------------------------------------------------------

      - name: Verify Terraform Plan
        shell: bash
        run: |

          if [ ! -f "${TF_WORKING_DIR}/tfplan" ]; then
            echo "ERROR: tfplan file not found."
            exit 1
          fi

          echo "Terraform plan found."

          ls -lh "${TF_WORKING_DIR}/tfplan"


      # --------------------------------------------------------
      # 9. Terraform Apply
      #
      # IMPORTANT:
      #
      # Yahan terraform plan dobara nahi banega.
      #
      # Same saved tfplan apply hoga jo Plan Job mein bana tha.
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -auto-approve \
            tfplan


      # --------------------------------------------------------
      # 10. Deployment Completed
      # --------------------------------------------------------

      - name: Deployment Completed
        run: |

          echo "=========================================="
          echo "Terraform Apply Completed Successfully"
          echo "=========================================="
          
name: Terraform CI-CD


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  # Feature branch par push hone par pipeline chalegi
  push:
    branches:
      - "feature/**"
      - main

  # Pull Request towards main
  pull_request:
    branches:
      - main


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read


# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================

env:

  # Terraform version
  TF_VERSION: "1.9.8"

  # IMPORTANT:
  # Aapka actual Terraform root module yahan hai
  TF_WORKING_DIR: "./Dev Module"


# ============================================================
# JOB 1
# FEATURE BRANCH - TERRAFORM PLAN
#
# feature/*
#      |
#      v
# Checkout
#      |
#      v
# Terraform Setup
#      |
#      v
# Azure Login
#      |
#      v
# Configure ARM Authentication
#      |
#      v
# Create terraform.tfvars
#      |
#      v
# Terraform Init
#      |
#      v
# Terraform Validate
#      |
#      v
# Terraform Plan
#      |
#      v
# Upload Plan
# ============================================================

jobs:

  terraform-plan-feature:

    name: Terraform Plan - Feature

    # Sirf feature branch push par chalega
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    # ========================================================
    # Terraform Azure Service Principal Authentication
    # ========================================================

    env:

      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}

      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}


    steps:

      # ------------------------------------------------------
      # STEP 1 - Checkout Code
      # ------------------------------------------------------

      - name: Checkout Code

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 2 - Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # STEP 3 - Azure Login
      #
      # AZURE_CREDENTIALS secret:
      #
      # {
      #   "clientId": "...",
      #   "clientSecret": "...",
      #   "subscriptionId": "...",
      #   "tenantId": "..."
      # }
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------------
      # STEP 4 - Verify Azure Login
      # ------------------------------------------------------

      - name: Verify Azure Login

        shell: bash

        run: |

          echo "Checking Azure authentication..."

          az account show --output table

          echo "Azure login successful."


      # ------------------------------------------------------
      # STEP 5 - Verify Terraform Directory
      # ------------------------------------------------------

      - name: Verify Terraform Directory

        shell: bash

        run: |

          echo "Current directory:"
          pwd

          echo ""
          echo "Terraform working directory:"
          echo "${TF_WORKING_DIR}"

          echo ""
          echo "Terraform files:"
          find "${TF_WORKING_DIR}" -maxdepth 1 -type f -name "*.tf" -print

          if [ ! -d "${TF_WORKING_DIR}" ]; then

            echo "ERROR: Terraform working directory does not exist."

            exit 1

          fi

          TF_COUNT=$(find "${TF_WORKING_DIR}" -maxdepth 1 -type f -name "*.tf" | wc -l)

          if [ "$TF_COUNT" -eq 0 ]; then

            echo "ERROR: No Terraform .tf files found."

            exit 1

          fi

          echo ""
          echo "Found ${TF_COUNT} Terraform configuration files."


      # ------------------------------------------------------
      # STEP 6 - Verify ARM Authentication Variables
      #
      # SECRET VALUES PRINT NAHI KARENGE
      # ------------------------------------------------------

      - name: Verify Terraform Authentication

        shell: bash

        run: |

          if [ -z "$ARM_CLIENT_ID" ]; then

            echo "ERROR: ARM_CLIENT_ID is not configured."

            exit 1

          fi

          if [ -z "$ARM_CLIENT_SECRET" ]; then

            echo "ERROR: ARM_CLIENT_SECRET is not configured."

            exit 1

          fi

          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then

            echo "ERROR: ARM_SUBSCRIPTION_ID is not configured."

            exit 1

          fi

          if [ -z "$ARM_TENANT_ID" ]; then

            echo "ERROR: ARM_TENANT_ID is not configured."

            exit 1

          fi

          echo "Terraform Service Principal credentials are configured."


      # ------------------------------------------------------
      # STEP 7 - Create terraform.tfvars
      #
      # TERRAFORM_TFVARS GitHub Secret se file create hogi
      # ------------------------------------------------------

      - name: Create Terraform TFVars

        shell: bash

        env:

          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |

          if [ -z "$TFVARS_CONTENT" ]; then

            echo "ERROR: TERRAFORM_TFVARS secret is empty."

            exit 1

          fi

          printf '%s' "$TFVARS_CONTENT" > "${TF_WORKING_DIR}/terraform.tfvars"

          echo "terraform.tfvars created successfully."


      # ------------------------------------------------------
      # STEP 8 - Verify TFVars
      # ------------------------------------------------------

      - name: Verify Terraform TFVars

        shell: bash

        run: |

          if [ ! -f "${TF_WORKING_DIR}/terraform.tfvars" ]; then

            echo "ERROR: terraform.tfvars was not created."

            exit 1

          fi

          echo "terraform.tfvars exists."


      # ------------------------------------------------------
      # STEP 9 - Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: |

          terraform init


      # ------------------------------------------------------
      # STEP 10 - Terraform Format Check
      # ------------------------------------------------------

      - name: Terraform Format Check

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: |

          terraform fmt -check -recursive


      # ------------------------------------------------------
      # STEP 11 - Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: |

          terraform validate


      # ------------------------------------------------------
      # STEP 12 - Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: |

          terraform plan \
            -var-file="terraform.tfvars" \
            -out="tfplan"


      # ------------------------------------------------------
      # STEP 13 - Verify Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        shell: bash

        run: |

          if [ ! -f "${TF_WORKING_DIR}/tfplan" ]; then

            echo "ERROR: tfplan was not created."

            exit 1

          fi

          echo "Terraform plan created successfully."


      # ------------------------------------------------------
      # STEP 14 - Upload Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan

        uses: actions/upload-artifact@v4

        with:

          name: terraform-plan-feature-${{ github.sha }}

          path: ${{ env.TF_WORKING_DIR }}/tfplan

          retention-days: 1



  # ============================================================
  # JOB 2
  # FEATURE BRANCH APPROVAL
  #
  # Plan
  #   |
  #   v
  # Approval
  #   |
  #   v
  # NO APPLY
  # ============================================================

  feature-approval:

    name: Feature Branch Approval

    needs:
      - terraform-plan-feature

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')

    runs-on: ubuntu-latest

    environment:

      name: Feature-Approval


    steps:

      - name: Feature Approval Completed

        run: |

          echo "=========================================="
          echo "Feature Terraform Plan Approved"
          echo "=========================================="

          echo "No Terraform Apply will run."



  # ============================================================
  # JOB 3
  # MAIN BRANCH - TERRAFORM PLAN
  #
  # main
  #  |
  #  v
  # Checkout
  #  |
  #  v
  # Azure Login
  #  |
  #  v
  # ARM Authentication
  #  |
  #  v
  # Terraform Init
  #  |
  #  v
  # Terraform Validate
  #  |
  #  v
  # Terraform Plan
  #  |
  #  v
  # Upload Plan
  # ============================================================

  terraform-plan-main:

    name: Terraform Plan - Main

    # Sirf main branch push par
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest


    # ========================================================
    # Terraform Azure Service Principal Authentication
    # ========================================================

    env:

      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}

      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}


    steps:

      # ------------------------------------------------------
      # STEP 1 - Checkout
      # ------------------------------------------------------

      - name: Checkout Code

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 2 - Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # STEP 3 - Azure Login
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------------
      # STEP 4 - Verify Azure Login
      # ------------------------------------------------------

      - name: Verify Azure Login

        shell: bash

        run: |

          az account show --output table

          echo "Azure login successful."


      # ------------------------------------------------------
      # STEP 5 - Verify Terraform Authentication
      # ------------------------------------------------------

      - name: Verify Terraform Authentication

        shell: bash

        run: |

          if [ -z "$ARM_CLIENT_ID" ]; then

            echo "ERROR: ARM_CLIENT_ID is not configured."

            exit 1

          fi

          if [ -z "$ARM_CLIENT_SECRET" ]; then

            echo "ERROR: ARM_CLIENT_SECRET is not configured."

            exit 1

          fi

          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then

            echo "ERROR: ARM_SUBSCRIPTION_ID is not configured."

            exit 1

          fi

          if [ -z "$ARM_TENANT_ID" ]; then

            echo "ERROR: ARM_TENANT_ID is not configured."

            exit 1

          fi

          echo "Terraform Service Principal credentials are configured."


      # ------------------------------------------------------
      # STEP 6 - Verify Terraform Directory
      # ------------------------------------------------------

      - name: Verify Terraform Directory

        shell: bash

        run: |

          if [ ! -d "${TF_WORKING_DIR}" ]; then

            echo "ERROR: Terraform directory does not exist."

            exit 1

          fi

          TF_COUNT=$(find "${TF_WORKING_DIR}" -maxdepth 1 -type f -name "*.tf" | wc -l)

          if [ "$TF_COUNT" -eq 0 ]; then

            echo "ERROR: No Terraform .tf files found."

            exit 1

          fi

          echo "Terraform configuration found."


      # ------------------------------------------------------
      # STEP 7 - Create TFVars
      # ------------------------------------------------------

      - name: Create Terraform TFVars

        shell: bash

        env:

          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |

          if [ -z "$TFVARS_CONTENT" ]; then

            echo "ERROR: TERRAFORM_TFVARS secret is empty."

            exit 1

          fi

          printf '%s' "$TFVARS_CONTENT" > "${TF_WORKING_DIR}/terraform.tfvars"

          echo "terraform.tfvars created successfully."


      # ------------------------------------------------------
      # STEP 8 - Terraform Init
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: |

          terraform init


      # ------------------------------------------------------
      # STEP 9 - Terraform Format
      # ------------------------------------------------------

      - name: Terraform Format Check

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: |

          terraform fmt -check -recursive


      # ------------------------------------------------------
      # STEP 10 - Terraform Validate
      # ------------------------------------------------------

      - name: Terraform Validate

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: |

          terraform validate


      # ------------------------------------------------------
      # STEP 11 - Terraform Plan
      # ------------------------------------------------------

      - name: Terraform Plan

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: |

          terraform plan \
            -var-file="terraform.tfvars" \
            -out="tfplan"


      # ------------------------------------------------------
      # STEP 12 - Verify Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        shell: bash

        run: |

          if [ ! -f "${TF_WORKING_DIR}/tfplan" ]; then

            echo "ERROR: tfplan file was not created."

            exit 1

          fi

          echo "Terraform plan created successfully."


      # ------------------------------------------------------
      # STEP 13 - Upload Plan
      # ------------------------------------------------------

      - name: Upload Terraform Plan

        uses: actions/upload-artifact@v4

        with:

          name: terraform-plan-main-${{ github.sha }}

          path: ${{ env.TF_WORKING_DIR }}/tfplan

          retention-days: 1



  # ============================================================
  # JOB 4
  # MAIN BRANCH - PRODUCTION APPROVAL + APPLY
  #
  # Main Plan
  #     |
  #     v
  # Production Approval
  #     |
  #     v
  # Download Same Plan
  #     |
  #     v
  # Terraform Apply
  # ============================================================

  terraform-apply-main:

    name: Terraform Apply - Production

    needs:
      - terraform-plan-main

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest


    # ========================================================
    # IMPORTANT
    #
    # GitHub Environment:
    #
    # Prod
    #
    # Required reviewers yahan configure karein.
    # ========================================================

    environment:

      name: Prod


    # ========================================================
    # Terraform Azure Service Principal Authentication
    # ========================================================

    env:

      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}

      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}

      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}


    steps:

      # ------------------------------------------------------
      # STEP 1 - Checkout
      # ------------------------------------------------------

      - name: Checkout Code

        uses: actions/checkout@v4


      # ------------------------------------------------------
      # STEP 2 - Setup Terraform
      # ------------------------------------------------------

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: ${{ env.TF_VERSION }}


      # ------------------------------------------------------
      # STEP 3 - Azure Login
      # ------------------------------------------------------

      - name: Azure Login

        uses: azure/login@v2

        with:

          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ------------------------------------------------------
      # STEP 4 - Verify Azure Login
      # ------------------------------------------------------

      - name: Verify Azure Login

        shell: bash

        run: |

          az account show --output table

          echo "Azure login successful."


      # ------------------------------------------------------
      # STEP 5 - Verify Terraform Authentication
      # ------------------------------------------------------

      - name: Verify Terraform Authentication

        shell: bash

        run: |

          if [ -z "$ARM_CLIENT_ID" ]; then

            echo "ERROR: ARM_CLIENT_ID is not configured."

            exit 1

          fi

          if [ -z "$ARM_CLIENT_SECRET" ]; then

            echo "ERROR: ARM_CLIENT_SECRET is not configured."

            exit 1

          fi

          if [ -z "$ARM_SUBSCRIPTION_ID" ]; then

            echo "ERROR: ARM_SUBSCRIPTION_ID is not configured."

            exit 1

          fi

          if [ -z "$ARM_TENANT_ID" ]; then

            echo "ERROR: ARM_TENANT_ID is not configured."

            exit 1

          fi

          echo "Terraform Service Principal credentials are configured."


      # ------------------------------------------------------
      # STEP 6 - Verify Terraform Directory
      # ------------------------------------------------------

      - name: Verify Terraform Directory

        shell: bash

        run: |

          if [ ! -d "${TF_WORKING_DIR}" ]; then

            echo "ERROR: Terraform directory does not exist."

            exit 1

          fi

          TF_COUNT=$(find "${TF_WORKING_DIR}" -maxdepth 1 -type f -name "*.tf" | wc -l)

          if [ "$TF_COUNT" -eq 0 ]; then

            echo "ERROR: No Terraform .tf files found."

            exit 1

          fi

          echo "Terraform configuration found."


      # ------------------------------------------------------
      # STEP 7 - Create TFVars
      # ------------------------------------------------------

      - name: Create Terraform TFVars

        shell: bash

        env:

          TFVARS_CONTENT: ${{ secrets.TERRAFORM_TFVARS }}

        run: |

          if [ -z "$TFVARS_CONTENT" ]; then

            echo "ERROR: TERRAFORM_TFVARS secret is empty."

            exit 1

          fi

          printf '%s' "$TFVARS_CONTENT" > "${TF_WORKING_DIR}/terraform.tfvars"

          echo "terraform.tfvars created successfully."


      # ------------------------------------------------------
      # STEP 8 - Terraform Init
      #
      # Apply job is a NEW runner.
      # Isliye init dobara karna required hai.
      # ------------------------------------------------------

      - name: Terraform Init

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: |

          terraform init


      # ------------------------------------------------------
      # STEP 9 - Download EXACT PLAN
      #
      # Main Plan job mein jo plan create hua tha
      # wahi plan download hoga.
      # ------------------------------------------------------

      - name: Download Terraform Plan

        uses: actions/download-artifact@v4

        with:

          name: terraform-plan-main-${{ github.sha }}

          path: ${{ env.TF_WORKING_DIR }}


      # ------------------------------------------------------
      # STEP 10 - Verify Plan
      # ------------------------------------------------------

      - name: Verify Terraform Plan

        shell: bash

        run: |

          if [ ! -f "${TF_WORKING_DIR}/tfplan" ]; then

            echo "ERROR: tfplan file not found."

            exit 1

          fi

          echo "Terraform plan found."

          ls -lh "${TF_WORKING_DIR}/tfplan"


      # ------------------------------------------------------
      # STEP 11 - Terraform Apply
      #
      # Ye step Prod Environment approval ke BAAD chalega.
      # ------------------------------------------------------

      - name: Terraform Apply

        working-directory: ${{ env.TF_WORKING_DIR }}

        run: |

          terraform apply \
            -auto-approve \
            tfplan


      # ------------------------------------------------------
      # STEP 12 - Deployment Completed
      # ------------------------------------------------------

      - name: Deployment Completed

        run: |

          echo "=========================================="
          echo "Terraform Apply Completed Successfully"
          echo "=========================================="